<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: homepage-field-manual-index.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f3e7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-paper-grain region texture" data-region="paper-grain" style="background-image:url('../../../assets/plates/paper-grain.png');background-repeat:repeat"></div>
  <div class="r-masthead-rule region chrome" data-region="masthead-rule"><!-- slim paper masthead with one graphite bottom rule --></div>
  <div class="r-brand-name region text" data-region="brand-name"><!-- The System Design Atlas in dark editorial serif --><p style="font-size:var(--r-brand-name-font);line-height:1.05;margin:0">brand-name</p></div>
  <div class="r-brand-author region text" data-region="brand-author"><!-- by Rahul Kumar in compact muted serif --><p style="font-size:var(--r-brand-author-font);line-height:1.05;margin:0">brand-author</p></div>
  <div class="r-primary-navigation region control" data-region="primary-navigation"><!-- four simple text navigation links: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-navigation); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-search-control region control" data-region="search-control"><!-- quiet search control aligned to masthead: rebuild the control's chrome from the crop (comp-spec.mjs --crop search-control); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-chapter-rail region chrome" data-region="chapter-rail"><!-- left handbook index rail separated by graphite rules --></div>
  <div class="r-chapter-dsa region control" data-region="chapter-dsa"><!-- active chapter 01 DSA from the beginning in burnt orange: rebuild the control's chrome from the crop (comp-spec.mjs --crop chapter-dsa); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-chapter-java region control" data-region="chapter-java"><!-- chapter 02 Java backend engineering: rebuild the control's chrome from the crop (comp-spec.mjs --crop chapter-java); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-chapter-system-design region control" data-region="chapter-system-design"><!-- chapter 03 System design interviews: rebuild the control's chrome from the crop (comp-spec.mjs --crop chapter-system-design); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-chapter-project region control" data-region="chapter-project"><!-- chapter 04 Production URL shortener: rebuild the control's chrome from the crop (comp-spec.mjs --crop chapter-project); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-chapter-caption region text" data-region="chapter-caption"><!-- Four paths. A deeper you. compact supporting label --><p style="font-size:var(--r-chapter-caption-font);line-height:1.05;margin:0">chapter-caption</p></div>
  <div class="r-hero-kicker region text" data-region="hero-kicker"><!-- An engineering learning workshop in compact letterspaced type --><p style="font-size:var(--r-hero-kicker-font);line-height:1.05;margin:0">hero-kicker</p></div>
  <div class="r-hero-headline region text" data-region="hero-headline"><!-- The System Design Atlas as the dominant two-line editorial serif headline --><p style="font-size:var(--r-hero-headline-font);font-family:var(--r-hero-headline-family),sans-serif;font-weight:var(--r-hero-headline-weight);line-height:1.05;margin:0">hero-headline</p></div>
  <div class="r-hero-subheadline region text" data-region="hero-subheadline"><!-- Learn the code. Understand the system. in medium editorial serif --><p style="font-size:var(--r-hero-subheadline-font);line-height:1.05;margin:0">hero-subheadline</p></div>
  <div class="r-hero-intro region text" data-region="hero-intro"><!-- short practical description in readable sans-serif --><p style="font-size:var(--r-hero-intro-font);line-height:1.05;margin:0">hero-intro</p></div>
  <div class="r-hero-action region control" data-region="hero-action"><!-- single solid burnt-orange Start with a goal button: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-motto region text" data-region="hero-motto"><!-- Same curiosity. Bigger systems. compact margin note --><p style="font-size:var(--r-hero-motto-font);line-height:1.05;margin:0">hero-motto</p></div>
  <div class="r-hero-credit region text" data-region="hero-credit"><!-- Rahul Kumar, engineer, writer, lifelong learner credit line --><p style="font-size:var(--r-hero-credit-font);line-height:1.05;margin:0">hero-credit</p></div>
  <figure class="r-rahul-system-portrait region plate" data-region="rahul-system-portrait"><img src="../../../assets/plates/rahul-system-portrait.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-architecture-sketch region chrome" data-region="architecture-sketch"><!-- small semantic load balancer architecture sketch with users, app servers and database --></div>
  <div class="r-right-margin-note region text" data-region="right-margin-note"><!-- short factual Rahul note in an informal annotation treatment --><p style="font-size:var(--r-right-margin-note-font);line-height:1.05;margin:0">right-margin-note</p></div>
  <div class="r-compass-marker region chrome" data-region="compass-marker"><!-- small semantic compass and Explore Learn Build Repeat legend --></div>
  <div class="r-recent-band-rule region chrome" data-region="recent-band-rule"><!-- recent writing section separated by strong horizontal rule and three editorial columns --></div>
  <div class="r-recent-heading region text" data-region="recent-heading"><!-- Recently published section heading --><p style="font-size:var(--r-recent-heading-font);line-height:1.05;margin:0">recent-heading</p></div>
  <div class="r-recent-caption region text" data-region="recent-caption"><!-- Fresh writing for practical engineers supporting label --><p style="font-size:var(--r-recent-caption-font);line-height:1.05;margin:0">recent-caption</p></div>
  <figure class="r-recent-feature-image region plate" data-region="recent-feature-image"><img src="../../../assets/plates/recent-feature-image.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-recent-article-one region text" data-region="recent-article-one"><!-- Move Zeroes article metadata, title and summary --><p style="font-size:var(--r-recent-article-one-font);line-height:1.05;margin:0">recent-article-one</p></div>
  <div class="r-recent-article-two region text" data-region="recent-article-two"><!-- Recursion in Java article metadata, title and summary --><p style="font-size:var(--r-recent-article-two-font);line-height:1.05;margin:0">recent-article-two</p></div>
  <div class="r-recent-article-three region text" data-region="recent-article-three"><!-- URL Shortener System Design article metadata, title and summary --><p style="font-size:var(--r-recent-article-three-font);line-height:1.05;margin:0">recent-article-three</p></div>
</main>
</body>
</html>
